<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting… | Version TimeTravel</title>
    <meta name="robots" content="noindex" />
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        background: #0e100e;
        color: #7c857d;
        font: 12px ui-monospace, monospace;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <p>REDIRECTING TO THE ARCHIVE…</p>

    <!--
      Legacy deep-link shim.

      The pre-2026 build linked to viewer.html?version=<file>&id=&num=&date=. GitHub Pages
      cannot redirect, so this has to stay as a real file or every existing bookmark 404s
      silently. It maps the old contract onto the /v/:id route and then gets out of the way.
    -->
    <script>
      (function () {
        var BASE = '/version-timetravel/'
        var params = new URLSearchParams(window.location.search)

        // Old path values, which were bare filenames relative to the site root.
        var byPath = {
          'version30.html': 'v3',
          'version28.html': 'v2-8',
          'version25.html': 'v2-5',
          'version2.html': 'v2',
          'version1.html': 'v1',
          'landingpage.html': 'landing',
          'src/versions/v1/index.html': 'v1',
          'src/versions/v2/index.html': 'v2',
        }

        // Old ids used dots; the new ones are URL-safe.
        var byId = {
          v1: 'v1',
          v2: 'v2',
          'v2.5': 'v2-5',
          landing: 'landing',
          'v2.8': 'v2-8',
          v3: 'v3',
          'v3.5': 'v3-5',
          commercial: 'commercial',
        }

        var version = (params.get('version') || '').replace(/^\//, '')
        var id = byPath[version] || byId[params.get('id')] || null

        window.location.replace(BASE + (id ? 'v/' + id : ''))
      })()
    </script>
  </body>
</html>
